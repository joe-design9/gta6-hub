name: Build IPA

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project GTA6Hub.xcodeproj \
            -scheme GTA6Hub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GTA6Hub.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH"
            find build -name "*.app" -maxdepth 5
            exit 1
          fi
          rm -rf Payload GTA6Hub-1.0.0.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry GTA6Hub-1.0.0.ipa Payload
          ls -lh GTA6Hub-1.0.0.ipa

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA6Hub-ipa
          path: GTA6Hub-1.0.0.ipa
          if-no-files-found: error

      - name: Attach IPA to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: GTA6Hub-1.0.0.ipa
