name: GTA 6 Hub QA
on:
  workflow_dispatch:
jobs:
  qa:
    name: Simulator QA screenshots
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build QA configuration (simulator)
        run: |
          xcodebuild \
            -project GTA6Hub.xcodeproj \
            -scheme GTA6Hub \
            -configuration QA \
            -sdk iphonesimulator \
            -derivedDataPath "$PWD/build-qa" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Boot iPhone 15 Pro Max simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -Eo 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          echo "Runtime: $RUNTIME"
          DEVICE_ID=$(xcrun simctl create "QA-iPhone-15-Pro-Max" "iPhone 15 Pro Max" "$RUNTIME")
          echo "Device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus booted -b
          xcrun simctl ui booted appearance dark
      - name: Install app
        run: |
          APP_PATH="build-qa/Build/Products/QA-iphonesimulator/GTA6Hub.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "QA app not found at $APP_PATH"
            find build-qa -name "*.app" -maxdepth 5
            exit 1
          fi
          xcrun simctl install booted "$APP_PATH"
      - name: Capture screenshots
        run: |
          mkdir -p shots
          capture() {
            name="$1"; shift
            xcrun simctl launch --terminate-running-process booted dev.joe.gta6hub "$@" || true
            sleep 5
            xcrun simctl io booted screenshot "shots/$name.png"
          }
          capture home -UITestMode
          capture countdown -UITestMode -QAStartTab 1
          capture chat -UITestMode -QAStartTab 2
          capture news -UITestMode -QAStartTab 3
          capture gallery -UITestMode -QAStartTab 4
          capture map -UITestMode -QAStartTab 5
          capture nostalgia -UITestMode -QAStartTab 6
          capture settings -UITestMode -QAStartTab 7
          capture chat-empty -QAStartTab 2
          capture home-real
          capture countdown-released -UITestMode -QAStartTab 1 -QAPreviewReleased
          ls -la shots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: hub-qa-screenshots
          path: shots/
          if-no-files-found: error
